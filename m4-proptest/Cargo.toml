[package]
name = "m4-proptest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Module 4 demo: proptest-verified safe_div kernel governed by a pv-validated YAML contract."

[lib]
path = "src/lib.rs"

[[bin]]
name = "safediv-demo"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"

# `--cfg kani` is set by `cargo kani`; register it so `cargo build`
# under Rust 1.80+ doesn't flag the `#[cfg(kani)]` verification module
# as an unexpected cfg (clippy -D warnings would otherwise fail CI).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
