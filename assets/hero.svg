<!-- GRID PROTOCOL MANIFEST
     Canvas: 1200x600 | text_elements: 0 | role: img
     Zone 1 (0..400): type-shield (invariants in the type system)
     Zone 2 (400..800): state-machine (typestate transitions)
     Zone 3 (800..1200): contract-scroll (proptest + YAML)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Design by Provable Contracts — type-system invariants, typestate transitions, proptest, and YAML contracts</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2240"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="50%" stop-color="#9f8fef"/>
      <stop offset="100%" stop-color="#36b37e"/>
    </linearGradient>
    <radialGradient id="aura-blue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura-violet" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9f8fef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9f8fef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura-green" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#36b37e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#36b37e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- zone dividers -->
  <line x1="400" y1="80" x2="400" y2="520" stroke="#30363d" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="800" y1="80" x2="800" y2="520" stroke="#30363d" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Zone 1: type-shield -->
  <g id="zone-typeshield" transform="translate(200 300)">
    <ellipse cx="0" cy="0" rx="170" ry="170" fill="url(#aura-blue)"/>
    <path d="M 0 -120 L 100 -75 L 100 50 Q 100 110 0 150 Q -100 110 -100 50 L -100 -75 Z"
          fill="#161b22" stroke="#4a9eff" stroke-width="5" stroke-linejoin="round"/>
    <!-- T glyph for Type -->
    <line x1="-44" y1="-32" x2="44" y2="-32" stroke="#4a9eff" stroke-width="6"/>
    <line x1="0" y1="-32" x2="0" y2="60" stroke="#4a9eff" stroke-width="6"/>
    <!-- locked-state checkmarks -->
    <circle cx="-50" cy="90" r="12" fill="none" stroke="#36b37e" stroke-width="4"/>
    <path d="M -57 90 L -52 96 L -42 84" fill="none" stroke="#36b37e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="90" r="12" fill="none" stroke="#36b37e" stroke-width="4"/>
    <path d="M 43 90 L 48 96 L 58 84" fill="none" stroke="#36b37e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Zone 2: state-machine -->
  <g id="zone-typestate" transform="translate(600 300)">
    <ellipse cx="0" cy="0" rx="170" ry="170" fill="url(#aura-violet)"/>
    <!-- 3 state nodes with arrows -->
    <circle cx="-110" cy="0" r="42" fill="#161b22" stroke="#9f8fef" stroke-width="5"/>
    <circle cx="0" cy="0" r="42" fill="#161b22" stroke="#9f8fef" stroke-width="5"/>
    <circle cx="110" cy="0" r="42" fill="#161b22" stroke="#9f8fef" stroke-width="5"/>
    <!-- inner glyphs: closed lock, open lock, key -->
    <rect x="-122" y="-12" width="24" height="20" fill="none" stroke="#9f8fef" stroke-width="3.5" rx="3"/>
    <path d="M -118 -12 L -118 -22 Q -118 -32 -110 -32 Q -102 -32 -102 -22 L -102 -12" fill="none" stroke="#9f8fef" stroke-width="3.5"/>
    <rect x="-12" y="-12" width="24" height="20" fill="none" stroke="#9f8fef" stroke-width="3.5" rx="3"/>
    <path d="M -8 -12 L -8 -22 Q -8 -32 0 -32 Q 12 -32 12 -16" fill="none" stroke="#9f8fef" stroke-width="3.5"/>
    <circle cx="100" cy="-2" r="10" fill="none" stroke="#9f8fef" stroke-width="3.5"/>
    <line x1="108" y1="-2" x2="124" y2="-2" stroke="#9f8fef" stroke-width="3.5"/>
    <line x1="118" y1="-2" x2="118" y2="6" stroke="#9f8fef" stroke-width="3.5"/>
    <!-- arrows -->
    <path d="M -64 0 L -46 0" stroke="url(#flow)" stroke-width="5" fill="none" marker-end="url(#arrowhead-violet)"/>
    <path d="M 46 0 L 64 0" stroke="url(#flow)" stroke-width="5" fill="none" marker-end="url(#arrowhead-violet)"/>
    <defs>
      <marker id="arrowhead-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#9f8fef"/>
      </marker>
    </defs>
  </g>

  <!-- Zone 3: contract-scroll -->
  <g id="zone-contract" transform="translate(1000 300)">
    <ellipse cx="0" cy="0" rx="170" ry="170" fill="url(#aura-green)"/>
    <rect x="-90" y="-110" width="180" height="220" rx="14" fill="#161b22" stroke="#36b37e" stroke-width="5"/>
    <!-- YAML-ish lines -->
    <line x1="-68" y1="-78" x2="50" y2="-78" stroke="#36b37e" stroke-width="4"/>
    <line x1="-68" y1="-50" x2="68" y2="-50" stroke="#7ee787" stroke-width="3" opacity="0.85"/>
    <line x1="-68" y1="-26" x2="40" y2="-26" stroke="#7ee787" stroke-width="3" opacity="0.85"/>
    <line x1="-68" y1="-2" x2="62" y2="-2" stroke="#7ee787" stroke-width="3" opacity="0.85"/>
    <line x1="-68" y1="22" x2="46" y2="22" stroke="#7ee787" stroke-width="3" opacity="0.85"/>
    <!-- proptest dice -->
    <rect x="-44" y="50" width="36" height="36" rx="6" fill="none" stroke="#ffab00" stroke-width="4"/>
    <circle cx="-32" cy="62" r="3" fill="#ffab00"/>
    <circle cx="-20" cy="68" r="3" fill="#ffab00"/>
    <circle cx="-32" cy="74" r="3" fill="#ffab00"/>
    <rect x="8" y="50" width="36" height="36" rx="6" fill="none" stroke="#ffab00" stroke-width="4"/>
    <circle cx="26" cy="62" r="3" fill="#ffab00"/>
    <circle cx="26" cy="74" r="3" fill="#ffab00"/>
    <!-- passing checkmark -->
    <circle cx="60" cy="68" r="14" fill="none" stroke="#36b37e" stroke-width="4"/>
    <path d="M 51 68 L 57 75 L 70 60" fill="none" stroke="#36b37e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- bottom flow line tying the three together -->
  <path d="M 260 480 Q 600 540 940 480" stroke="url(#flow)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <circle cx="260" cy="480" r="10" fill="#4a9eff"/>
  <circle cx="600" cy="510" r="10" fill="#9f8fef"/>
  <circle cx="940" cy="480" r="10" fill="#36b37e"/>
</svg>
